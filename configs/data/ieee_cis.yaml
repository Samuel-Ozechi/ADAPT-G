data:
  transaction_file: train_transaction.csv
  identity_file: train_identity.csv
  id_column: TransactionID
  target_column: isFraud
  time_column: TransactionDT

# Field groupings (used by AG-004 preprocessing and AG-008 graph construction).
fields:
  card: [card1, card2, card3, card4, card5, card6]
  address: [addr1, addr2]
  email: [P_emaildomain, R_emaildomain]
  vesta_c: [C1, C2, C3, C4, C5, C6, C7, C8, C9, C10, C11, C12, C13, C14]
  vesta_d: [D1, D2, D3, D4, D5, D6, D7, D8, D9, D10, D11, D12, D13, D14, D15]
  vesta_m: [M1, M2, M3, M4, M5, M6, M7, M8, M9]
  vesta_v_prefix: "V"  # V1..V339
  identity_prefix: "id_"
  device: [DeviceType, DeviceInfo]