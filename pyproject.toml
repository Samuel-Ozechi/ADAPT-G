[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adapt-g"
version = "0.1.0"
description = "Adversarial Diffusion and Probabilistic Transformer-Graphs for Financial Fraud Detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy<2",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "lightgbm>=4.0",
    "PyYAML",
    "torch>=2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4", "pytest-cov>=4.1"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
